<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI 象棋">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>AI 象棋</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>AI 象棋</h1>
  <span id="hdrLevel" class="hdr-badge">初级</span>
  <button id="btnSettings" aria-label="设置">⚙️</button>
</header>

<main>
  <div id="boardWrap">
    <div id="board">
      <svg id="boardSvg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="pieces"></div>
    </div>
  </div>

  <div id="status" class="status">准备开始</div>
  <div id="coach" class="coach"></div>

  <nav id="actions">
    <button id="btnHint">💡 提示</button>
    <button id="btnUndo">↩️ 悔棋</button>
    <button id="btnNew" class="primary">🔄 重开</button>
  </nav>
</main>

<div id="settingsMask" class="mask hidden">
  <div class="sheet">
    <h2>对局设置</h2>
    <div class="field">
      <label>难度</label>
      <div class="seg" id="levelSeg">
        <button data-level="1">入门</button>
        <button data-level="2" class="active">初级</button>
        <button data-level="3">中级</button>
        <button data-level="4">高级</button>
      </div>
    </div>
    <div class="field">
      <label>我执</label>
      <div class="seg" id="sideSeg">
        <button data-side="red" class="active">红方(先手)</button>
        <button data-side="black">黑方(后手)</button>
      </div>
    </div>
    <p class="note">修改设置会立即开始新的一局。</p>
    <div class="sheet-actions">
      <button id="btnCloseSheet" class="wide">关闭</button>
    </div>
  </div>
</div>

<div id="overMask" class="mask hidden">
  <div class="sheet center">
    <div id="overEmoji" class="over-emoji">🏆</div>
    <div id="overText" class="over-text"></div>
    <div class="sheet-actions">
      <button id="btnOverNew" class="primary wide">再来一局</button>
      <button id="btnOverClose" class="wide">查看终局</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/rules.js"></script>
<script src="js/ai.js"></script>
<script src="app.js"></script>
<script src="sw-register.js"></script>
</body>
</html>
